  <path class="d s" pathLength="1" d="M600 760L620 720M620 760L600 720M600 720L620 680M620 720L600 680M600 680L620 640M620 680L600 640M600 640L620 600M620 640L600 600M600 600L620 560M620 600L600 560M600 560L620 520M620 560L600 520M600 520L620 480M620 520L600 480M600 480L620 440M620 480L600 440M600 440L620 400M620 440L600 400M600 400L620 360M620 400L600 360M600 360L620 320M620 360L600 320M600 320L620 280M620 320L600 280M600 280L620 240M620 280L600 240M600 240L620 200M620 240L600 200M600 200L620 160M620 200L600 160M600 160L620 120M620 160L600 120" style="animation-delay:1.10s"/>

