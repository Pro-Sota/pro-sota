<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMax slice" fill="none" role="img" aria-labelledby="hero-title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hero-title">Architectural line drawing of a tall tower, surrounding buildings and a construction crane</title>
  <style>
    :root {
      --bg: #F7F7F5;
      --line: #BD9655;
      --grid: .16;
    }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--line); stroke-width: 1; stroke-opacity: var(--grid); }
    .grid-major { stroke: var(--line); stroke-width: 1; stroke-opacity: .28; }
    .d {
      stroke: var(--line);
      stroke-linecap: square;
      stroke-dasharray: 1 1;
      stroke-dashoffset: 1;
      animation: draw 18s linear infinite both;
    }
    /* Three stroke tiers */
    .p { stroke-width: 3; }
    .s { stroke-width: 1.5; stroke-opacity: .7; }
    .t { stroke-width: 1; stroke-opacity: .4; }
    /* Supporting buildings sit back so the tower leads */
    .bk { opacity: .6; }
    .win { fill: var(--line); opacity: 0; animation: glow 18s linear infinite both; }
    /* One 18s cycle per element: draw, hold, erase in build order, rest.
       Every element shares the same period, so staggered delays stay in sync on each loop. */
    @keyframes draw {
      0%   { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.6,.1,.2,1); }
      9%   { stroke-dashoffset: 0; }
      66%  { stroke-dashoffset: 0; animation-timing-function: ease-in-out; }
      75%, 100% { stroke-dashoffset: 1; }
    }
    @keyframes glow {
      0%   { opacity: 0; }
      5%, 66% { opacity: .35; }
      72%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d { animation: none; stroke-dashoffset: 0; }
      .win { animation: none; opacity: .35; }
    </style>

  <rect class="bg" width="1600" height="760"/>

  <!-- Engineering-paper grid: every 5th line stronger -->
  <path class="grid" d="M80 0V760M160 0V760M240 0V760M320 0V760M480 0V760M560 0V760M640 0V760M720 0V760M880 0V760M960 0V760M1040 0V760M1120 0V760M1280 0V760M1360 0V760M1440 0V760M1520 0V760M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600"/>
  <path class="grid-major" d="M0 0V760M400 0V760M800 0V760M1200 0V760M1600 0V760M0 0H1600M0 400H1600"/>

  <!-- 1. Ground -->
  <path class="d p" pathLength="1" d="M0 760H1600" style="animation-delay:0.00s" stroke-opacity=".9" stroke-width="2"/>

  <!-- 2. Hero tower: frame, crown, spire -->
  <path class="d p" pathLength="1" d="M980 760V150H1180V760" style="animation-delay:0.20s"/>
  <path class="d p" pathLength="1" d="M1010 150V110H1150V150M1080 110V40" style="animation-delay:0.70s"/>

