<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-labelledby="svc-title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="svc-title">Desenho técnico de um edifício em obra, com estrutura, grua e cotas de fiscalização</title>
  <style>
    :root { --line: #BD9655; --check: #8B6A2F; }
    .d {
      stroke: var(--line);
      stroke-linecap: square;
      stroke-dasharray: 1 1;
      stroke-dashoffset: 1;
      animation: draw 18s linear infinite both;
    }
    .p { stroke-width: 3; }
    .s { stroke-width: 1.5; stroke-opacity: .75; }
    .t { stroke-width: 1; stroke-opacity: .45; }
    .k { stroke: var(--check); stroke-width: 2; }
    .bk { opacity: .65; }
    .win { fill: var(--line); opacity: 0; animation: glow 18s linear infinite both; }
    /* One 18s cycle: build (architecture, structure, construction, inspection), hold, erase in order, rest */
    @keyframes draw {
      0%   { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.6,.1,.2,1); }
      9%   { stroke-dashoffset: 0; }
      66%  { stroke-dashoffset: 0; animation-timing-function: ease-in-out; }
      75%, 100% { stroke-dashoffset: 1; }
    }
    @keyframes glow {
      0%   { opacity: 0; }
      5%, 66% { opacity: .35; }
      72%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d { animation: none; stroke-dashoffset: 0; }
      .win { animation: none; opacity: .35; }
    }
  </style>

  <!-- Ground -->
  <path class="d p" pathLength="1" d="M0 700H1200" style="animation-delay:0s" stroke-width="2"/>

